<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura de eav-queries</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Rubik:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fcefe4;   /* beige */
      --color-ink:     #161616;   /* near-black */
      --color-muted:   #6b6663;   /* warm grey */
      --color-accent:  #fc6656;   /* coral */
      --font-sans:     'Rubik', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · eav-queries</p>
    <h1>Un solo camino validado hasta la base</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arq-title arq-desc">
      <title id="arq-title">Arquitectura de eav-queries</title>
      <desc id="arq-desc">El SPA de Vue y el modo IA de Gemini llegan a la misma base DuckDB de sólo lectura a través del motor de consultas validado: los routers de FastAPI reparten entre catálogo, motor y chat, el catálogo lee por repositorios de SQL fijo y sólo el motor compone SQL en tiempo de ejecución.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6663"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fc6656"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7e33c3"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fcefe4"/>

      <!-- ============ ZONA: un solo servicio despliegable ============ -->
      <rect x="240" y="56" width="696" height="508" rx="8" fill="rgba(22,22,22,0.02)" stroke="rgba(22,22,22,0.10)" stroke-width="0.8"/>
      <rect x="264" y="60" width="152" height="12" rx="2" fill="#fcefe4"/>
      <text x="340" y="69" fill="rgba(22,22,22,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FASTAPI · UN SERVICIO</text>

      <!-- ============ CONEXIONES (antes de las cajas) ============ -->

      <!-- SPA → FastAPI -->
      <line x1="192" y1="332" x2="256" y2="332" stroke="#7e33c3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="206" y="312" width="36" height="12" rx="2" fill="#fcefe4"/>
      <text x="224" y="323" fill="#7e33c3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/API/*</text>

      <!-- FastAPI → Catálogo (sale por arriba, entra por abajo) -->
      <path d="M344,288 V224 Q344,216 352,216 H552 Q560,216 560,208 V160" fill="none" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="424" y="196" width="56" height="12" rx="2" fill="#fcefe4"/>
      <text x="452" y="207" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/QUESTIONS</text>

      <!-- FastAPI → Motor -->
      <line x1="432" y1="332" x2="496" y2="332" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="446" y="312" width="36" height="12" rx="2" fill="#fcefe4"/>
      <text x="464" y="323" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/QUERY</text>

      <!-- FastAPI → Chat (sale por abajo, entra por arriba) -->
      <path d="M344,376 V416 Q344,424 352,424 H552 Q560,424 560,432 V476" fill="none" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="436" y="404" width="32" height="12" rx="2" fill="#fcefe4"/>
      <text x="452" y="415" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/CHAT</text>

      <!-- Chat → Motor: la misma función que llama la UI manual -->
      <line x1="592" y1="476" x2="592" y2="388" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="600" y="424" width="52" height="12" rx="2" fill="#fcefe4"/>
      <text x="604" y="435" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RUN_QUERY</text>

      <!-- Catálogo → Repositorios -->
      <line x1="688" y1="124" x2="752" y2="124" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Repositorios → DuckDB -->
      <path d="M836,160 V216 Q836,224 844,224 H1048 Q1056,224 1056,232 V276" fill="none" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="938" y="204" width="44" height="12" rx="2" fill="#fcefe4"/>
      <text x="960" y="215" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL FIJO</text>

      <!-- Motor → DuckDB -->
      <line x1="688" y1="332" x2="1008" y2="332" stroke="#fc6656" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="812" y="312" width="72" height="12" rx="2" fill="#fcefe4"/>
      <text x="848" y="323" fill="#fc6656" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL COMPUESTO</text>

      <!-- Chat → Gemini -->
      <line x1="688" y1="496" x2="1008" y2="496" stroke="#7e33c3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="812" y="476" width="72" height="12" rx="2" fill="#fcefe4"/>
      <text x="848" y="487" fill="#7e33c3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT + TOOL</text>

      <!-- Gemini → Chat (vuelta: la llamada a la herramienta) -->
      <line x1="1008" y1="528" x2="688" y2="528" stroke="#7e33c3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <rect x="812" y="508" width="72" height="12" rx="2" fill="#fcefe4"/>
      <text x="848" y="519" fill="#7e33c3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FUNCTION_CALL</text>

      <!-- build_db → DuckDB -->
      <line x1="1152" y1="160" x2="1152" y2="276" stroke="#6b6663" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="1088" y="212" width="56" height="12" rx="2" fill="#fcefe4"/>
      <text x="1144" y="223" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">EN EL BUILD</text>

      <!-- ============ NODOS ============ -->

      <!-- SPA (cliente) -->
      <rect x="40" y="288" width="152" height="88" rx="6" fill="#fcefe4"/>
      <rect x="40" y="288" width="152" height="88" rx="6" fill="rgba(107,102,99,0.10)" stroke="#7d7873" stroke-width="1"/>
      <rect x="48" y="294" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,120,115,0.40)" stroke-width="0.8"/>
      <text x="62" y="303" fill="#6b6663" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
      <text x="116" y="340" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">Vue 3 + Vite</text>
      <text x="116" y="356" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manual · chat</text>

      <!-- FastAPI -->
      <rect x="256" y="288" width="176" height="88" rx="6" fill="#fcefe4"/>
      <rect x="256" y="288" width="176" height="88" rx="6" fill="#ffffff" stroke="#161616" stroke-width="1"/>
      <rect x="264" y="294" width="28" height="12" rx="2" fill="transparent" stroke="rgba(22,22,22,0.40)" stroke-width="0.8"/>
      <text x="278" y="303" fill="#161616" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="344" y="340" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">FastAPI</text>
      <text x="344" y="356" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routers/ · :8000</text>

      <!-- Catálogo -->
      <rect x="496" y="88" width="192" height="72" rx="6" fill="#fcefe4"/>
      <rect x="496" y="88" width="192" height="72" rx="6" fill="#ffffff" stroke="#161616" stroke-width="1"/>
      <rect x="504" y="94" width="28" height="12" rx="2" fill="transparent" stroke="rgba(22,22,22,0.40)" stroke-width="0.8"/>
      <text x="518" y="103" fill="#161616" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="592" y="132" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">Catálogo</text>
      <text x="592" y="148" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lru_cache por ola</text>

      <!-- Motor de consultas (FOCAL) -->
      <rect x="496" y="276" width="192" height="112" rx="6" fill="#fcefe4"/>
      <rect x="496" y="276" width="192" height="112" rx="6" fill="rgba(252,102,86,0.08)" stroke="#fc6656" stroke-width="1.2"/>
      <rect x="504" y="282" width="40" height="12" rx="2" fill="transparent" stroke="rgba(252,102,86,0.40)" stroke-width="0.8"/>
      <text x="524" y="291" fill="#fc6656" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOTOR</text>
      <text x="592" y="324" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">Motor de consultas</text>
      <text x="592" y="342" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">services/query/</text>
      <text x="592" y="358" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allowlist · factor_cvnl</text>

      <!-- Modo IA (opcional) -->
      <rect x="496" y="476" width="192" height="72" rx="6" fill="#fcefe4"/>
      <rect x="496" y="476" width="192" height="72" rx="6" fill="rgba(22,22,22,0.02)" stroke="rgba(22,22,22,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="504" y="482" width="24" height="12" rx="2" fill="transparent" stroke="rgba(22,22,22,0.30)" stroke-width="0.8"/>
      <text x="516" y="491" fill="#6b6663" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IA</text>
      <text x="592" y="520" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">Modo IA (chat)</text>
      <text x="592" y="536" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tool use · opt-in</text>

      <!-- Repositorios -->
      <rect x="752" y="88" width="168" height="72" rx="6" fill="#fcefe4"/>
      <rect x="752" y="88" width="168" height="72" rx="6" fill="#ffffff" stroke="#161616" stroke-width="1"/>
      <rect x="760" y="94" width="32" height="12" rx="2" fill="transparent" stroke="rgba(22,22,22,0.40)" stroke-width="0.8"/>
      <text x="776" y="103" fill="#161616" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
      <text x="836" y="132" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">Repositorios</text>
      <text x="836" y="148" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQL fijo</text>

      <!-- Build de la base (fuera del runtime) -->
      <rect x="1008" y="88" width="192" height="72" rx="6" fill="#fcefe4"/>
      <rect x="1008" y="88" width="192" height="72" rx="6" fill="rgba(22,22,22,0.02)" stroke="rgba(22,22,22,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="1016" y="94" width="40" height="12" rx="2" fill="transparent" stroke="rgba(22,22,22,0.30)" stroke-width="0.8"/>
      <text x="1036" y="103" fill="#6b6663" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>
      <text x="1104" y="132" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">Build de la base</text>
      <text x="1104" y="148" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">db/build_db.py</text>

      <!-- DuckDB -->
      <rect x="1008" y="276" width="192" height="112" rx="6" fill="#fcefe4"/>
      <rect x="1008" y="276" width="192" height="112" rx="6" fill="rgba(22,22,22,0.05)" stroke="#6b6663" stroke-width="1"/>
      <rect x="1016" y="282" width="24" height="12" rx="2" fill="transparent" stroke="rgba(107,102,99,0.40)" stroke-width="0.8"/>
      <text x="1028" y="291" fill="#6b6663" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="1104" y="324" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">DuckDB</text>
      <text x="1104" y="342" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sólo lectura · EAV</text>
      <text x="1104" y="358" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 olas · 1.1M respuestas</text>

      <!-- Gemini (externo) -->
      <rect x="1008" y="476" width="192" height="72" rx="6" fill="#fcefe4"/>
      <rect x="1008" y="476" width="192" height="72" rx="6" fill="rgba(22,22,22,0.03)" stroke="rgba(22,22,22,0.30)" stroke-width="1"/>
      <rect x="1016" y="482" width="28" height="12" rx="2" fill="transparent" stroke="rgba(22,22,22,0.30)" stroke-width="0.8"/>
      <text x="1030" y="491" fill="#6b6663" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="1104" y="520" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">Gemini</text>
      <text x="1104" y="536" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">google.genai</text>

      <!-- ============ LEYENDA ============ -->
      <line x1="40" y1="628" x2="1240" y2="628" stroke="rgba(22,22,22,0.10)" stroke-width="0.8"/>
      <text x="40" y="644" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="152" y="632" width="12" height="12" rx="2" fill="rgba(107,102,99,0.10)" stroke="#7d7873" stroke-width="0.8"/>
      <text x="172" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">cliente</text>

      <rect x="340" y="632" width="12" height="12" rx="2" fill="rgba(252,102,86,0.08)" stroke="#fc6656" stroke-width="0.8"/>
      <text x="360" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">motor validado</text>

      <rect x="528" y="632" width="12" height="12" rx="2" fill="rgba(22,22,22,0.05)" stroke="#6b6663" stroke-width="0.8"/>
      <text x="548" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">archivo de datos</text>

      <rect x="716" y="632" width="12" height="12" rx="2" fill="rgba(22,22,22,0.03)" stroke="rgba(22,22,22,0.30)" stroke-width="0.8"/>
      <text x="736" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">servicio externo</text>

      <rect x="904" y="632" width="12" height="12" rx="2" fill="rgba(22,22,22,0.02)" stroke="rgba(22,22,22,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="924" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">opcional · build</text>

      <line x1="1092" y1="638" x2="1116" y2="638" stroke="#7e33c3" stroke-width="1.2"/>
      <text x="1124" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">HTTP externo</text>
    </svg>
  </div>
</body>
</html>
