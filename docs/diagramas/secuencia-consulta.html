<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta manual: del clic a la tabla</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Rubik:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fcefe4;
      --color-ink:     #161616;
      --color-muted:   #6b6663;
      --color-accent:  #fc6656;
      --font-sans:     'Rubik', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Secuencia · consulta manual</p>
    <h1>Del clic en la barra lateral a la tabla ponderada</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seqman-title seqman-desc">
      <title id="seqman-title">Consulta manual: del clic a la tabla</title>
      <desc id="seqman-desc">Secuencia de una consulta armada en la interfaz: el router entrega el QueryRequest al motor, que primero lee del catálogo el tipo de pregunta y los atributos válidos, valida contra esa lista blanca cada identificador que mandó el cliente, compone el SQL con filtros y centinelas, lo ejecuta ponderado por factor_cvnl y arma las tablas de conteos y porcentajes.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6663"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fc6656"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7e33c3"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fcefe4"/>

      <!-- ============ LÍNEAS DE VIDA ============ -->
      <line x1="160" y1="128" x2="160" y2="584" stroke="rgba(22,22,22,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="128" x2="480" y2="584" stroke="rgba(22,22,22,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="584" stroke="rgba(22,22,22,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1120" y1="128" x2="1120" y2="584" stroke="rgba(22,22,22,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ============ BARRAS DE ACTIVACIÓN ============ -->
      <rect x="476" y="168" width="8" height="392" fill="rgba(22,22,22,0.06)" stroke="#6b6663" stroke-width="0.8"/>
      <rect x="796" y="200" width="8" height="328" fill="rgba(22,22,22,0.06)" stroke="#6b6663" stroke-width="0.8"/>
      <rect x="1116" y="232" width="8" height="32" fill="rgba(22,22,22,0.06)" stroke="#6b6663" stroke-width="0.8"/>
      <rect x="1116" y="408" width="8" height="32" fill="rgba(22,22,22,0.06)" stroke="#6b6663" stroke-width="0.8"/>

      <!-- ============ MENSAJES ============ -->

      <!-- 1. la UI arma el cuerpo desde el store -->
      <line x1="160" y1="168" x2="476" y2="168" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="290" y="148" width="60" height="12" rx="2" fill="#fcefe4"/>
      <text x="320" y="159" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /QUERY</text>

      <!-- 2. el router no hace lógica: sólo entrega el contrato -->
      <line x1="484" y1="200" x2="796" y2="200" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="608" y="180" width="64" height="12" rx="2" fill="#fcefe4"/>
      <text x="640" y="191" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERYREQUEST</text>

      <!-- 3. el catálogo sale de la base, no de una lista escrita a mano -->
      <line x1="804" y1="232" x2="1116" y2="232" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="938" y="212" width="44" height="12" rx="2" fill="#fcefe4"/>
      <text x="960" y="223" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CATÁLOGO</text>

      <!-- 4. tipo de pregunta + atributos válidos de la ola -->
      <line x1="1116" y1="264" x2="804" y2="264" stroke="#6b6663" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="926" y="244" width="68" height="12" rx="2" fill="#fcefe4"/>
      <text x="960" y="255" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIPO/OPCIONES</text>

      <!-- 5. todo identificador del cliente se valida contra esa lista -->
      <path d="M804,288 H840 Q848,288 848,296 V312 Q848,320 840,320 H808" fill="none" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="856" y="298" width="56" height="12" rx="2" fill="#fcefe4"/>
      <text x="860" y="308" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ALLOWLIST</text>

      <!-- 6. scope + filtros + centinelas, armados en el momento -->
      <path d="M804,344 H840 Q848,344 848,352 V368 Q848,376 840,376 H808" fill="none" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="856" y="354" width="64" height="12" rx="2" fill="#fcefe4"/>
      <text x="860" y="364" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">COMPONER SQL</text>

      <!-- 7. initial_only ⇒ cohorte inicial + factor_cvnl -->
      <line x1="804" y1="408" x2="1116" y2="408" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="926" y="388" width="68" height="12" rx="2" fill="#fcefe4"/>
      <text x="960" y="399" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL PONDERADO</text>

      <!-- 8. filas sin ordenar ni etiquetar -->
      <line x1="1116" y1="440" x2="804" y2="440" stroke="#6b6663" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="928" y="420" width="64" height="12" rx="2" fill="#fcefe4"/>
      <text x="960" y="431" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FILAS CRUDAS</text>

      <!-- 9. conteos, porcentajes, Total y orden declarado -->
      <path d="M804,464 H840 Q848,464 848,472 V488 Q848,496 840,496 H808" fill="none" stroke="#6b6663" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="856" y="474" width="56" height="12" rx="2" fill="#fcefe4"/>
      <text x="860" y="484" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PIVOTE + %</text>

      <!-- 10. tablas listas para la UI o el CSV -->
      <line x1="796" y1="528" x2="484" y2="528" stroke="#6b6663" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="622" y="508" width="36" height="12" rx="2" fill="#fcefe4"/>
      <text x="640" y="519" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TABLAS</text>

      <!-- 11. respuesta al navegador -->
      <line x1="476" y1="560" x2="164" y2="560" stroke="#fc6656" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="292" y="540" width="56" height="12" rx="2" fill="#fcefe4"/>
      <text x="320" y="551" fill="#fc6656" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · JSON</text>

      <!-- ============ ACTORES ============ -->

      <!-- Sidebar + store -->
      <rect x="40" y="56" width="240" height="72" rx="6" fill="#fcefe4"/>
      <rect x="40" y="56" width="240" height="72" rx="6" fill="rgba(107,102,99,0.10)" stroke="#7d7873" stroke-width="1"/>
      <rect x="48" y="62" width="24" height="12" rx="2" fill="transparent" stroke="rgba(125,120,115,0.40)" stroke-width="0.8"/>
      <text x="60" y="71" fill="#6b6663" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="160" y="100" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">Sidebar + store</text>
      <text x="160" y="116" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">store.js · buildBody</text>

      <!-- Router de consultas -->
      <rect x="360" y="56" width="240" height="72" rx="6" fill="#fcefe4"/>
      <rect x="360" y="56" width="240" height="72" rx="6" fill="#ffffff" stroke="#161616" stroke-width="1"/>
      <rect x="368" y="62" width="32" height="12" rx="2" fill="transparent" stroke="rgba(22,22,22,0.40)" stroke-width="0.8"/>
      <text x="384" y="71" fill="#161616" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
      <text x="480" y="100" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">Router de consultas</text>
      <text x="480" y="116" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routers/query.py</text>

      <!-- Motor de consultas (FOCAL) -->
      <rect x="680" y="56" width="240" height="72" rx="6" fill="#fcefe4"/>
      <rect x="680" y="56" width="240" height="72" rx="6" fill="rgba(252,102,86,0.08)" stroke="#fc6656" stroke-width="1.2"/>
      <rect x="688" y="62" width="40" height="12" rx="2" fill="transparent" stroke="rgba(252,102,86,0.40)" stroke-width="0.8"/>
      <text x="708" y="71" fill="#fc6656" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOTOR</text>
      <text x="800" y="100" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">Motor de consultas</text>
      <text x="800" y="116" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runner · sql_builder</text>

      <!-- DuckDB -->
      <rect x="1000" y="56" width="240" height="72" rx="6" fill="#fcefe4"/>
      <rect x="1000" y="56" width="240" height="72" rx="6" fill="rgba(22,22,22,0.05)" stroke="#6b6663" stroke-width="1"/>
      <rect x="1008" y="62" width="24" height="12" rx="2" fill="transparent" stroke="rgba(107,102,99,0.40)" stroke-width="0.8"/>
      <text x="1020" y="71" fill="#6b6663" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="1120" y="100" fill="#161616" font-size="12" font-weight="600" font-family="'Rubik', sans-serif" text-anchor="middle">DuckDB</text>
      <text x="1120" y="116" fill="#6b6663" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sólo lectura · EAV</text>

      <!-- ============ LEYENDA ============ -->
      <line x1="40" y1="628" x2="1240" y2="628" stroke="rgba(22,22,22,0.10)" stroke-width="0.8"/>
      <text x="40" y="644" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <line x1="152" y1="638" x2="176" y2="638" stroke="#6b6663" stroke-width="1.2"/>
      <text x="184" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">llamada</text>

      <line x1="340" y1="638" x2="364" y2="638" stroke="#6b6663" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="372" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">retorno</text>

      <line x1="528" y1="638" x2="552" y2="638" stroke="#fc6656" stroke-width="1.2"/>
      <text x="560" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">respuesta final</text>

      <rect x="760" y="632" width="12" height="12" rx="2" fill="rgba(252,102,86,0.08)" stroke="#fc6656" stroke-width="0.8"/>
      <text x="780" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">camino validado</text>

      <rect x="976" y="632" width="12" height="12" rx="2" fill="rgba(22,22,22,0.05)" stroke="#6b6663" stroke-width="0.8"/>
      <text x="996" y="642" fill="#6b6663" font-size="8" font-family="'Geist Mono', monospace">archivo de datos</text>
    </svg>
  </div>
</body>
</html>
