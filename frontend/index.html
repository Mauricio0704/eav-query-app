<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta "Así Vamos" — Consulta de datos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dist/output.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div class="flex h-screen overflow-hidden">

  <!-- ── SIDEBAR ── -->
  <aside id="sidebar" class="w-[300px] shrink-0 bg-surface border-r border-border flex flex-col overflow-hidden transition-[width] duration-200 ease-in-out">

    <div class="px-5 pt-5 pb-4 border-b border-border">
      <div class="font-serif text-[18px] font-light tracking-[-0.01em] text-ink leading-[1.2]">
        Encuesta<br><span class="text-accent italic">Así Vamos</span>
      </div>
      <div class="text-[11px] text-faint mt-1 tracking-[.04em] uppercase">Constructor de consultas · Datos 2025</div>
    </div>

    <div class="overflow-y-auto px-5 py-4">

      <div class="mb-5">
        <label class="block text-[10px] font-medium tracking-[.08em] uppercase text-faint mb-2">Pregunta</label>
        <select id="sel-question" class="field-select" onchange="onQuestionChange()">
          <option value="">Cargando preguntas…</option>
        </select>
      </div>

      <div class="mb-5">
        <label class="block text-[10px] font-medium tracking-[.08em] uppercase text-faint mb-2">Agrupar resultados por</label>
        <select id="sel-groupby" class="field-select" onchange="updateSQL()">
          <option value="answer">Respuesta</option>
          <option value="city_id">Ciudad</option>
        </select>
      </div>

    </div>

    <div class="text-[10px] font-medium uppercase tracking-[.08em] text-faint mx-5 mb-1">SQL generado</div>
    <div class="relative flex-1 mx-5 mb-4 min-h-0">
      <div id="sql-preview"
           class="h-full bg-ink rounded-md px-3 py-2.5 pr-16 font-mono text-[10px] leading-[1.7] text-code-fg whitespace-pre-wrap break-all overflow-y-auto">-- Selecciona una pregunta</div>
      <button id="sql-copy-btn" onclick="copySQL()" title="Copiar SQL al portapapeles"
              class="absolute top-1.5 right-1.5 text-[10px] font-sans px-2 py-1 rounded bg-white/5 text-code-fg/70 hover:bg-white/15 hover:text-code-fg transition-colors cursor-pointer">
        Copiar
      </button>
    </div>

    <div class="px-5 py-[14px] border-t border-border flex gap-2">
      <button id="run-btn" onclick="runQuery()" disabled
              class="flex-1 py-2.5 bg-accent text-white border-0 rounded-md font-sans text-[13px] font-medium cursor-pointer tracking-[.02em] transition-opacity hover:opacity-[.88] disabled:opacity-45 disabled:cursor-not-allowed">
        Ejecutar consulta
      </button>
    </div>

  </aside>

  <!-- ── MAIN ── -->
  <main class="flex-1 flex flex-col overflow-hidden">

    <div class="px-7 py-4 border-b border-border bg-surface flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <button onclick="toggleSidebar()" title="Ocultar/mostrar panel"
                class="shrink-0 w-8 h-8 flex items-center justify-center rounded text-muted hover:text-accent hover:bg-bg transition-colors cursor-pointer text-[16px] leading-none">
          ☰
        </button>
        <div id="topbar-q" class="topbar-q empty">Selecciona una pregunta en el panel izquierdo</div>
      </div>
      <button id="export-btn" onclick="exportCSV()" disabled
              class="px-[14px] py-[7px] border border-border-strong rounded-md bg-transparent font-sans text-[12px] text-muted cursor-pointer transition-all whitespace-nowrap hover:bg-surface hover:border-accent hover:text-accent disabled:opacity-40 disabled:cursor-not-allowed">
        Descargar CSV
      </button>
    </div>

    <div id="results" class="flex-1 overflow-y-auto px-7 py-6">
      <div class="flex flex-col items-center justify-center h-full text-faint text-center gap-3">
        <div class="text-[42px] text-highlight opacity-80">◈</div>
        <div class="font-serif text-[18px] font-light italic text-ink">Sin resultados aún</div>
        <div class="text-[12px]">Configura los filtros y presiona "Ejecutar consulta"</div>
      </div>
    </div>

  </main>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const API = 'http://localhost:8000/api';

// ── State ───────────────────────────────────────────────────────────────────
let questions   = [];
let attributes  = [];
let lastResult  = null;
let activeTab   = 'table';
let chart       = null;

// ── Boot ────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const [qs, attrs] = await Promise.all([
      fetch(`${API}/questions`).then(r => r.json()),
      fetch(`${API}/attributes`).then(r => r.json()),
    ]);
    questions  = qs;
    attributes = attrs;

    const sel = document.getElementById('sel-question');
    sel.innerHTML = '<option value="">— Selecciona una pregunta —</option>';
    qs.forEach(q => {
      const opt = document.createElement('option');
      opt.value = q.q_id;
      opt.textContent = `${q.q_id} — ${q.q_text.slice(0, 60)}${q.q_text.length > 60 ? '…' : ''}`;
      sel.appendChild(opt);
    });

    const gb = document.getElementById('sel-groupby');
    attrs.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.attribute;
      opt.textContent = a.attribute;
      gb.appendChild(opt);
    });
  } catch(e) {
    document.getElementById('sel-question').innerHTML =
      '<option>Error conectando al servidor</option>';
    console.error(e);
  }
}

// ── Question change ──────────────────────────────────────────────────────────
function onQuestionChange() {
  const qId = document.getElementById('sel-question').value;
  const q   = questions.find(x => x.q_id === qId);
  document.getElementById('run-btn').disabled = !qId;
  if (q) {
    document.getElementById('topbar-q').textContent = q.q_text;
    document.getElementById('topbar-q').classList.remove('empty');
  } else {
    document.getElementById('topbar-q').textContent = 'Selecciona una pregunta en el panel izquierdo';
    document.getElementById('topbar-q').classList.add('empty');
  }
  updateSQL();
}

function getFilters() { return []; }

// ── SQL preview ──────────────────────────────────────────────────────────────
function updateSQL() {
  const qId   = document.getElementById('sel-question').value;
  const group = document.getElementById('sel-groupby').value;
  if (!qId) {
    document.getElementById('sql-preview').textContent = '-- Selecciona una pregunta';
    return;
  }

  const groupExpr = group === 'answer'  ? 'o.option_label'
                  : group === 'city_id' ? 'r.city_id'
                  : `(SELECT COALESCE(o2.option_label, rg.value::TEXT)\n      FROM respondent_attributes rg\n      LEFT JOIN options o2 ON o2.question_id = rg.question_id AND o2.option_id = rg.value\n      WHERE rg.respondent_id = r.respondent_id AND rg.attribute = '${group}' LIMIT 1)`;

  const sql = `SELECT ${groupExpr} AS grupo,\n  o.option_label AS respuesta,\n  COUNT(*) AS total\nFROM answers a\nJOIN responses r ON r.respondent_id = a.respondent_id\nLEFT JOIN options o ON o.question_id = a.question_id AND o.option_id = a.option_id\nWHERE a.question_id = '${qId}'\nGROUP BY grupo, respuesta\nORDER BY grupo, total DESC`;

  document.getElementById('sql-preview').textContent = sql;
}

// ── Run query ────────────────────────────────────────────────────────────────
async function runQuery() {
  const qId   = document.getElementById('sel-question').value;
  const group = document.getElementById('sel-groupby').value;
  if (!qId) return;

  const body = { question_id: qId, filters: getFilters(), group_by: group };

  document.getElementById('results').innerHTML =
    '<div class="flex items-center justify-center h-full gap-[10px] text-muted"><div class="spinner"></div> Consultando…</div>';
  document.getElementById('run-btn').disabled = true;

  try {
    const res = await fetch(`${API}/query`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || res.statusText);
    }
    lastResult = await res.json();
    renderResults(lastResult);
    document.getElementById('export-btn').disabled = false;
  } catch(e) {
    document.getElementById('results').innerHTML =
      `<div class="flex flex-col items-center justify-center h-full text-faint text-center gap-3"><div class="text-[42px] text-warm">⚠</div><div class="font-serif text-[18px] font-light italic text-ink">Error al consultar</div><div class="text-[12px]">${e.message}</div></div>`;
  } finally {
    document.getElementById('run-btn').disabled = false;
  }
}

// ── Render results ───────────────────────────────────────────────────────────
function renderResults(data) {
  const totalResp = data.total_respondents;
  const isPivot   = data.format === 'pivot';

  const statsHtml = `<div class="grid grid-cols-4 gap-[10px] mb-6">
    <div class="bg-surface border border-border rounded-[10px] px-4 py-[14px] border-l-[3px] border-l-accent2">
      <div class="font-serif text-[26px] font-light tracking-[-0.02em] text-accent2">${totalResp.toLocaleString('es-MX')}</div>
      <div class="text-[11px] text-muted mt-0.5">Respondentes</div>
    </div>
  </div>`;

  const tabsHtml = `<div class="flex border-b border-border mb-5">
    <div class="tab-btn ${activeTab==='table'?'active':''}" onclick="switchTab('table')">Tabla</div>
    <div class="tab-btn ${activeTab==='chart'?'active':''}" onclick="switchTab('chart')">Gráfica</div>
  </div>`;

  const tableHtml = isPivot ? buildPivotTables(data) : buildFlatTable(data);
  const chartHtml = `<div class="relative h-[320px]"><canvas id="main-chart"></canvas></div>`;
  const bodyHtml  = tabsHtml +
    `<div id="tab-table" style="display:${activeTab==='table'?'block':'none'}">${tableHtml}</div>` +
    `<div id="tab-chart" style="display:${activeTab==='chart'?'block':'none'}">${chartHtml}</div>`;

  document.getElementById('results').innerHTML = statsHtml + bodyHtml;

  if (activeTab === 'chart') {
    isPivot ? drawPivotChart(data) : drawChart(data);
  }
}

function buildPivotTables(data) {
  return `
    <h3 class="text-[11px] font-semibold uppercase tracking-[.06em] text-accent2 mb-3 flex items-center gap-2"><span class="inline-block w-1.5 h-1.5 rounded-full bg-accent2"></span>Conteos</h3>
    ${pivotTableHtml(data.counts)}
    <h3 class="text-[11px] font-semibold uppercase tracking-[.06em] text-accent mt-6 mb-3 flex items-center gap-2"><span class="inline-block w-1.5 h-1.5 rounded-full bg-accent"></span>Porcentajes</h3>
    ${pivotTableHtml(data.percentages)}
  `;
}

function pivotTableHtml(t) {
  let html = '<div class="overflow-x-auto"><table class="data-table"><thead><tr>';
  t.columns.forEach(c => { html += `<th>${c}</th>`; });
  html += '</tr></thead><tbody>';
  t.rows.forEach(row => {
    html += '<tr>';
    row.forEach((cell, i) => {
      const display = (cell === '' || cell == null) ? '' : cell;
      const isNum = typeof cell === 'number' && i >= 2;
      html += `<td class="${isNum ? 'font-mono text-[12px]' : ''}">${display}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function buildFlatTable(data) {
  const cols = data.column_labels;
  const rows = data.rows;
  let html = '<div class="overflow-x-auto"><table class="data-table"><thead><tr>';
  cols.forEach(c => { html += `<th>${c}</th>`; });
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr>';
    row.forEach((cell, i) => {
      const isNum = typeof cell === 'number';
      html += `<td class="${isNum ? 'font-mono text-[12px]' : ''}">${cell ?? ''}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function switchTab(t) {
  activeTab = t;
  const tabs = document.querySelectorAll('.tab-btn');
  tabs[0].classList.toggle('active', t === 'table');
  tabs[1].classList.toggle('active', t === 'chart');
  document.getElementById('tab-table').style.display = t === 'table' ? 'block' : 'none';
  document.getElementById('tab-chart').style.display = t === 'chart' ? 'block' : 'none';
  if (t === 'chart' && lastResult) {
    lastResult.format === 'pivot' ? drawPivotChart(lastResult) : drawChart(lastResult);
  }
}

function drawChart(data) {
  if (chart) { chart.destroy(); chart = null; }
  const canvas = document.getElementById('main-chart');
  if (!canvas) return;

  const isNumerica = data.question.q_type === 'numerica';
  const COLORS = ['#28c19b','#7e34c3','#ffba00','#fb7e50','#1f9778','#5d2691','#cc9500'];

  if (isNumerica) {
    const row = data.rows[0] || [];
    chart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: ['Promedio','Mínimo','Máximo'],
        datasets: [{
          label: data.question.q_text,
          data: [row[2], row[3], row[4]],
          backgroundColor: COLORS.map(c => c + 'CC'),
          borderColor: COLORS,
          borderWidth: 1, borderRadius: 3,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { family: 'DM Sans', size: 11 } } },
          y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { family: 'DM Sans', size: 11 } } },
        }
      }
    });
  } else {
    chart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: data.rows.map(r => r[0]),
        datasets: [{
          label: '%',
          data: data.rows.map(r => r[2]),
          backgroundColor: COLORS.map(c => c + 'CC'),
          borderColor: COLORS,
          borderWidth: 1, borderRadius: 3,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { family: 'DM Sans', size: 11 } } },
          y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { family: 'DM Sans', size: 11 }, callback: v => v + '%' } },
        }
      }
    });
  }
}

function drawPivotChart(data) {
  if (chart) { chart.destroy(); chart = null; }
  const canvas = document.getElementById('main-chart');
  if (!canvas) return;

  const cols = data.percentages.columns;
  const rows = data.percentages.rows.filter(r => r[0] !== 'Total');

  const groupLabels = cols.slice(2, -1);
  const groupRange  = groupLabels.map((_, i) => i + 2);

  const COLORS = ['#28c19b','#7e34c3','#ffba00','#fb7e50','#1f9778','#5d2691','#cc9500',
                  '#cc6540','#5feaba','#ad6ce0','#ffd266','#fda58a','#7fdcc3','#c094e0'];

  const datasets = rows.map((row, ri) => {
    const label = (row[1] !== '' && row[1] != null) ? String(row[1]) : String(row[0]);
    return {
      label,
      data: groupRange.map(i => Number(row[i]) || 0),
      backgroundColor: COLORS[ri % COLORS.length] + 'CC',
      borderColor: COLORS[ri % COLORS.length],
      borderWidth: 1,
    };
  });

  chart = new Chart(canvas, {
    type: 'bar',
    data: { labels: groupLabels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y}%` } },
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { family: 'DM Sans', size: 10 }, autoSkip: false, maxRotation: 60, minRotation: 30 } },
        y: { stacked: true, max: 100, grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { family: 'DM Sans', size: 11 }, callback: v => v + '%' } },
      },
    },
  });
}

// ── Export CSV ───────────────────────────────────────────────────────────────
async function exportCSV() {
  if (!lastResult) return;
  const qId   = document.getElementById('sel-question').value;
  const group = document.getElementById('sel-groupby').value;
  const body  = { question_id: qId, filters: getFilters(), group_by: group };

  const res  = await fetch(`${API}/query/csv`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const blob = await res.blob();
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `encuesta_p${qId}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ── Sidebar toggle ───────────────────────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const collapsed = sidebar.dataset.collapsed === 'true';
  sidebar.dataset.collapsed = !collapsed;
  sidebar.style.width = collapsed ? '300px' : '0px';
}

// ── Copy SQL to clipboard ────────────────────────────────────────────────────
async function copySQL() {
  const text = document.getElementById('sql-preview').textContent;
  const btn  = document.getElementById('sql-copy-btn');
  try {
    await navigator.clipboard.writeText(text);
    const orig = btn.textContent;
    btn.textContent = '¡Copiado!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  } catch (e) {
    console.error('Clipboard write failed:', e);
  }
}

// ── Start ────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
